[colors]
bg      = #0A0E14
fg      = #B3B1AD
accent  = #E6B450
muted   = #3D424D
urgent  = #FF3333

[bar/main]
width            = 100%
height           = 28
fixed-center     = true
bottom           = false
background       = ${colors.bg}
foreground       = ${colors.fg}
font-0           = JetBrainsMonoNL Nerd Font:size=10;2
border-bottom-size = 2
border-bottom-color = ${colors.accent}
padding-left     = 2
padding-right    = 2
module-margin    = 2
modules-left     = i3 vesktop
modules-center   = date
modules-right    = cpu memory volume

[module/i3]
type                     = internal/i3
format                   = <label-state>
index-sort               = true
label-focused            = %index%
label-focused-foreground = ${colors.accent}
label-focused-padding    = 2
label-unfocused          = %index%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding  = 2
label-urgent             = %index%
label-urgent-foreground  = ${colors.urgent}
label-urgent-padding     = 2

[module/date]
type     = internal/date
interval = 1
date     = %a %d %b
time     = %H:%M
label    = %date%  %time%

[module/cpu]
type     = internal/cpu
interval = 2
label    = 󰻠 %percentage%%

[module/memory]
type     = internal/memory
interval = 2
label    = 󰍛 %percentage_used%%

# [module/wlan]
# type                = internal/network
# interface-type      = wireless
# interval            = 3
# label-connected     =  %essid%
# label-disconnected  =  off
# label-disconnected-foreground = ${colors.muted}

[module/volume]
type          = internal/alsa
label-volume = 󰕾 %percentage%%
label-muted   =  muted
label-muted-foreground = ${colors.muted}

[module/vesktop]
type = custom/text
content = 󰙯
click-left = vesktop &

