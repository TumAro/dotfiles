# Big apps: each opens in its own named workspace and jumps you there. Plain i3 rules, no daemon
# (costs no RAM). To add one: copy a line, change the class (check with `xprop WM_CLASS`) and name.
for_window [class="(?i)^steam$"]          move container to workspace "4:steam",    workspace "4:steam"
for_window [class="(?i)^steam_app_.*"]    move container to workspace "5:game",     workspace "5:game"
for_window [class="(?i)^freecad$"]        move container to workspace "6:freecad",  workspace "6:freecad"
for_window [class="(?i)^blender$"]        move container to workspace "7:blender",  workspace "7:blender"
for_window [class="(?i)^gimp.*"]          move container to workspace "8:gimp",     workspace "8:gimp"
for_window [class="(?i)^(inkscape|krita)$"] move container to workspace "9:art",    workspace "9:art"
