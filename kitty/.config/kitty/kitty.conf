# ── Shell ─────────────────────────────────────────────────────────────────────
shell /usr/bin/zsh
shell_integration enabled

# ── Font ──────────────────────────────────────────────────────────────────────
font_family      JetBrainsMonoNL Nerd Font
font_size        12.0

# ── Scrollback ────────────────────────────────────────────────────────────────
scrollback_lines 10000

# ── Window ────────────────────────────────────────────────────────────────────
window_margin_width     1
confirm_os_window_close 0

# ── Tabs ──────────────────────────────────────────────────────────────────────
tab_bar_style       powerline
tab_powerline_style slanted

# ── Opacity ───────────────────────────────────────────────────────────────────
background_opacity 0.95

# ── Layouts ───────────────────────────────────────────────────────────────────
# tall  = one big pane left, stack of panes right  (good for coding + terminal)
# stack = fullscreen one pane at a time
# fat   = one big pane top, stack bottom
# grid  = even grid
enabled_layouts tall,stack

# ── Mouse ─────────────────────────────────────────────────────────────────────
mouse_hide_wait    3.0

# ── Theme ─────────────────────────────────────────────────────────────────────
include colors.conf

# ── Modifier ──────────────────────────────────────────────────────────────────
kitty_mod ctrl+shift

# ── Splits (set up now, tune hotkeys later) ───────────────────────────────────
map kitty_mod+enter  new_window_with_cwd
map kitty_mod+w      close_window
map kitty_mod+]      next_window
map kitty_mod+[      previous_window
map kitty_mod+up     neighboring_window up
map kitty_mod+down   neighboring_window down
map kitty_mod+left   neighboring_window left
map kitty_mod+right  neighboring_window right
map kitty_mod+r      start_resizing_window
map kitty_mod+space  next_layout
