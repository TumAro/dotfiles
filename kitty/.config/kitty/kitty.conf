# ── Shell ─────────────────────────────────────────────────────────────────────
shell /usr/bin/zsh
shell_integration enabled

# ── Font ──────────────────────────────────────────────────────────────────────
font_family      JetBrainsMonoNL Nerd Font
font_size        13.0

# ── Scrollback ────────────────────────────────────────────────────────────────
scrollback_lines 10000

# ── Window ────────────────────────────────────────────────────────────────────
window_margin_width     0
window_padding_width    14
confirm_os_window_close 0

# ── Tabs ──────────────────────────────────────────────────────────────────────
tab_bar_style       powerline
tab_powerline_style slanted

# ── Opacity ───────────────────────────────────────────────────────────────────
background_opacity 1.0

# ── Layouts ───────────────────────────────────────────────────────────────────
# splits = free vsplit/hsplit (ctrl+shift+s / ctrl+shift+d); tall = one big pane + stack; stack = one pane fullscreen
enabled_layouts splits,tall,stack

# ── Mouse ─────────────────────────────────────────────────────────────────────
mouse_hide_wait    3.0

# ── Theme ─────────────────────────────────────────────────────────────────────
include colors.conf

# ── Modifier ──────────────────────────────────────────────────────────────────
kitty_mod ctrl+shift

# ── Keybinds: Tabs ────────────────────────────────────────────────────────────
map ctrl+t    new_tab_with_cwd
map ctrl+q    close_tab
map ctrl+tab  next_tab

# ── Keybinds: Splits ──────────────────────────────────────────────────────────
map ctrl+shift+s    launch --location=vsplit --cwd=current
map ctrl+shift+d    launch --location=hsplit --cwd=current
map ctrl+alt+left   neighboring_window left
map ctrl+alt+right  neighboring_window right
map ctrl+alt+up     neighboring_window up
map ctrl+alt+down   neighboring_window down

# ── Keybinds: Move pane ───────────────────────────────────────────────────────
map ctrl+shift+h    move_window left
map ctrl+shift+l    move_window right
map ctrl+shift+k    move_window up
map ctrl+shift+j    move_window down
