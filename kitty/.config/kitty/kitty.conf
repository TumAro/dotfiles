# ── Shell ─────────────────────────────────────────────────────────────────────
shell /usr/bin/zsh
shell_integration enabled

# ── Font ──────────────────────────────────────────────────────────────────────
# Keep your existing font — change here if you want something else
font_family      JetBrainsMonoNL Nerd Font
bold_font        JetBrainsMonoNL Nerd Font Bold
italic_font      JetBrainsMonoNL Nerd Font Italic
font_size        12.0

# ── Cursor ────────────────────────────────────────────────────────────────────
cursor_shape          beam
cursor_blink_interval 0

# ── Scrollback ────────────────────────────────────────────────────────────────
scrollback_lines 10000

# ── Window ────────────────────────────────────────────────────────────────────
window_padding_width  8
hide_window_decorations no
confirm_os_window_close 0

# ── Tabs ──────────────────────────────────────────────────────────────────────
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    "{index}: {title}"
active_tab_font_style bold

# ── Opacity ───────────────────────────────────────────────────────────────────
background_opacity 0.95

# ── Layouts ───────────────────────────────────────────────────────────────────
# tall  = one big pane left, stack of panes right  (good for coding + terminal)
# stack = fullscreen one pane at a time
# fat   = one big pane top, stack bottom
# grid  = even grid
enabled_layouts tall,stack,fat,grid

# ── Mouse ─────────────────────────────────────────────────────────────────────
mouse_hide_wait    3.0
focus_follows_mouse yes

# ── Theme ─────────────────────────────────────────────────────────────────────
# Run: kitty +kitten themes
# Pick interactively — it writes a theme.conf file and adds the include below
include themes/theme.conf

# ── Keybinds ──────────────────────────────────────────────────────────────────
kitty_mod ctrl+shift

# Splits (kitty calls them windows)
map kitty_mod+enter  new_window_with_cwd
map kitty_mod+w      close_window
map kitty_mod+]      next_window
map kitty_mod+[      previous_window

# Vim-style focus movement between splits
map kitty_mod+h      neighboring_window left
map kitty_mod+l      neighboring_window right
map kitty_mod+k      neighboring_window up
map kitty_mod+j      neighboring_window down

# Resize active split
map kitty_mod+r      start_resizing_window

# Tabs
map kitty_mod+t      new_tab_with_cwd
map kitty_mod+q      close_tab
map ctrl+alt+l       next_tab
map ctrl+alt+h       previous_tab
map ctrl+alt+1       goto_tab 1
map ctrl+alt+2       goto_tab 2
map ctrl+alt+3       goto_tab 3
map ctrl+alt+4       goto_tab 4

# Cycle layouts
map kitty_mod+space  next_layout

# Font size
map ctrl+equal       change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+0           change_font_size all 0

# Clipboard
map kitty_mod+c      copy_to_clipboard
map kitty_mod+v      paste_from_clipboard


# BEGIN_KITTY_THEME
# Dracula
include current-theme.conf
# END_KITTY_THEME
