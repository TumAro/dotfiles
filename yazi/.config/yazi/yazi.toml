[manager]
keymap = [
  # Navigation — vim style
  { on = "k", run = "arrow -1",         desc = "up" },
  { on = "j", run = "arrow 1",          desc = "down" },
  { on = "h", run = "leave",            desc = "go to parent" },
  { on = "l", run = "enter",            desc = "enter dir / open file" },

  # Arrow keys too
  { on = "<Up>",    run = "arrow -1",   desc = "up" },
  { on = "<Down>",  run = "arrow 1",    desc = "down" },
  { on = "<Left>",  run = "leave",      desc = "parent" },
  { on = "<Right>", run = "enter",      desc = "enter" },

  # Jump
  { on = "g g", run = "arrow -99999",   desc = "top" },
  { on = "G",   run = "arrow 99999",    desc = "bottom" },

  # File operations
  { on = "y", run = "yank",             desc = "copy" },
  { on = "x", run = "yank --cut",       desc = "cut" },
  { on = "p", run = "paste",            desc = "paste" },
  { on = "d", run = "trash",            desc = "trash" },
  { on = "r", run = "rename",           desc = "rename" },
  { on = "a", run = "create",           desc = "create file/dir" },

  # Selection
  { on = "<Space>", run = "select --state=none", desc = "toggle select" },
  { on = "v",       run = "visual_mode",          desc = "visual select" },

  # Toggle hidden files
  { on = ".", run = "hidden toggle",    desc = "toggle hidden" },

  # Search
  { on = "f", run = "search fd",        desc = "search files" },
  { on = "/", run = "find",             desc = "find in current dir" },

  # Misc
  { on = "q", run = "quit",             desc = "quit" },
  { on = "<Esc>", run = "escape",       desc = "escape" },
]
