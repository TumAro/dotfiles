# Compositor: transparency (kitty background_opacity) plus blur behind kitty and vesktop only.
backend = "glx";
experimental-backends = true;
vsync = true;
shadow = false;
fading = false;

blur-method = "dual_kawase";
blur-strength = 4;
# blur everything except kitty and vesktop
blur-background-exclude = [ "!class_g = 'kitty' && !class_g = 'vesktop' && !class_g = 'Vesktop'" ];
