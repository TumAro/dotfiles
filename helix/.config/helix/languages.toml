[language-server.basedpyright]
command = "basedpyright-langserver"
args = ["--stdio"]

[language-server.harper-ls]
command = "harper-ls"
args = ["--stdio"]

[[language]]
name = "python"
# basedpyright (type checker) costs ~100-200 MB per Helix; re-add "basedpyright" first to get it back
language-servers = ["ruff"]

[[language]]
name = "typst"
auto-format = true
language-servers = ["tinymist", "harper-ls"]

[[language]]
name = "markdown"
language-servers = ["harper-ls"]

# tinymist: formatter = bundled typstyle (:fmt or auto-format), PDF re-exported on every keystroke for the zathura preview
[language-server.tinymist.config]
formatterMode = "typstyle"
exportPdf = "onType"
semanticTokens = "disable"
